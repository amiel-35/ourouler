# État d'avancement des sprints d'ourouler.
#
# Ce fichier est la SEULE source d'avancement des sprints : les fiches dans
# docs/backlog/*.md décrivent une feature (pourquoi, ce qu'on veut voir,
# quand c'est fini), elles ne portent aucun statut de sprint ni de livraison.
# On modifie ce fichier via le skill /backlog (planification, priorisation,
# vérification) ou à la main pour un ajustement ponctuel.
# scripts/verifier_backlog.py vérifie ce fichier mécaniquement, en local et
# en CI (règles statiques toujours, comparaison contre une base git avec
# --base pour empêcher un retour en arrière ou un remaniement furtif d'un
# sprint déjà figé/en cours).

# Chantiers : nom -> chemin (relatif à la racine du dépôt) du fichier qui le
# documente. Référencés par un élément [[sprint.element]] via chantier = "...".
[chantiers]
ouverture = "docs/ouverture_plan.md"

