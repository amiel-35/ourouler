# Secrets du *service*, pas du cycliste — exemple, à copier hors du dépôt.
#
# Le vrai fichier vit dans `~/.config/ourouler/service.toml`, en 0600, et
# **n'entre jamais dans le dépôt** (aucune donnée personnelle dans le dépôt). Celui-ci est son modèle,
# vide, et c'est le seul des deux qui est commité.
#
# ## Pourquoi un second fichier
#
# `config.example.toml` décrit le profil d'**un cycliste** : son départ, sa
# masse, sa FTP, ses vélos, sa clé Intervals. Celui-ci décrit ce qui appartient
# au **serveur** : ce qui sert à tous les utilisateurs et à aucun en
# particulier. Les deux ne se remplissent pas par la même personne et ne se
# déploient pas de la même façon.
#
# La frontière entre les deux est la décision Q35
# (`docs/journal/questions/questions_mainteneur.md`) : il n'accueille que ce qui
# est au service, et rien d'autre.
#
# ## Ce qui le lit
#
# `ourouler inviter` : `cli/` l'ouvre, valide la section
# [brevo] et passe le résultat à `api/courriel.py`, qui ne lit ni fichier ni
# variable lui-même (le cœur ne lit ni configuration ni environnement — `tests/test_invariants.py` le vérifie). Sans `--sans-courriel`, la commande refuse de démarrer avec un
# message lisible si ce fichier manque ou si [brevo] est incomplète.
#
# Le processus API le lit aussi, pour [quotas] — via
# `api/exploitation.py`, le seul module de l'API qui en a le droit, jamais
# `api/quotas.py` lui-même (même règle). Contrairement à [brevo],
# [quotas] est facultatif : son absence, ou celle du fichier entier, vaut le
# défaut, pas un refus de démarrer.

[brevo]
# Courriels d'invitation — doctrine §10.2, V1 : demande d'accès modérée à la
# main, puis lien à usage unique par courriel, puis passkey pour ne plus
# dépendre de la boîte mail.
#
# **Envoi par SMTP, pas par l'API REST.** C'est du
# protocole standard : aucune bibliothèque du fournisseur, et on change de
# prestataire en éditant trois lignes. L'API REST n'apporterait qu'un suivi
# d'ouverture dont ce produit n'a que faire.
#
# Attention, Brevo distribue **deux sortes de clés** et elles ne servent pas au
# même protocole : « xkeysib- » pour l'API v3, « xsmtpsib- » pour le relais
# SMTP. C'est la seconde qu'il faut ici, et elle sert de mot de passe.
# L'identifiant de connexion, lui, n'est pas la clé : c'est une adresse en
# `@smtp-brevo.com`, affichée à côté d'elle sur la même page.
serveur = "smtp-relay.brevo.com"
port = 587
utilisateur = ""
mot_de_passe = ""

# L'adresse expéditrice doit être **vérifiée chez Brevo** (Expéditeurs,
# domaines & IP), sinon le relais accepte la connexion et refuse le message —
# l'erreur n'arrive qu'au premier envoi.
expediteur = ""
nom_expediteur = "où rouler"

[quotas]
# Le coût par utilisateur. Doctrine §10.1 : Open-Meteo gratuit
# tolère ~10 000 appels par jour et par adresse IP, et un service hébergé où
# tous les comptes partagent la même adresse les additionne. Grouper
# plusieurs points dans une requête n'économise **aucun** appel décompté —
# Open-Meteo compte par coordonnée, pas par requête (doctrine §10.1) — donc `GET /meteo` (une couronne, deux modèles,
# ~50 appels) pèse lui aussi, pas seulement `POST /sorties`/`POST /boucles`
# (~150 chacune, cinq candidates). D'où deux réglages, pour deux postes.
#
# `generations_par_jour` borne, par compte et par jour (minuit UTC), les
# appels à `POST /sorties` et `POST /boucles`. **Calcul du défaut (20)** :
# 20 générations × ~150 appels ≈ 3 000, sur les 10 000 que tout le service
# partage par jour et par adresse IP — de quoi laisser de la place aux
# consultations météo (ci-dessous) et aux autres comptes du même service. À
# 40, 40 × 150 = 6 000 ne laisserait presque rien pour le reste.
#
# `consultations_meteo_par_jour` borne, séparément, `GET /meteo`.
# **Calcul du défaut (100)** : 100 × ~50 ≈ 5 000 — qui s'ajoutent aux ~3 000
# ci-dessus sans dépasser le budget partagé, pour un compte qui userait les
# deux plafonds à fond le même jour (3 000 + 5 000 = 8 000, sous les 10 000).
#
# Au-delà de l'un ou l'autre, l'API rend `429 quota_atteint` (`api/erreurs.py`,
# `front/src/composants/Echec.tsx`) — **même code pour les deux**, le message
# dit lequel des deux plafonds est atteint.
#
# **Absent, ou ce fichier absent : les défauts s'appliquent**
# (`api.quotas.GENERATIONS_PAR_JOUR_DEFAUT`,
# `api.quotas.CONSULTATIONS_METEO_PAR_JOUR_DEFAUT`) — un déploiement qui n'a
# pas encore de section `[quotas]` n'est pas sans plafond, il a le défaut.
# **Le mode personnel n'a aucun des deux quotas** (`OUROULER_MODE=personnel`,
# `ourouler api` sur un poste personnel) : ce réglage ne le concerne
# pas, il n'appelle Open-Meteo que depuis sa propre adresse IP.
generations_par_jour = 20
consultations_meteo_par_jour = 100

[demandes]
# Sprint 12 : le formulaire public « Demander une invitation »
# (`POST /api/v1/demandes-invitation`) envoie une alerte au mainteneur à
# chaque dépôt — `api/courriel.message_alerte_demande`, par le même relais
# `[brevo]` ci-dessus. Sans cette clé, la demande est **quand même
# enregistrée** (elle apparaît dans l'administration, `ourouler admin`) ;
# seule l'alerte ne part pas, et le journal du serveur le dit.
#
# **Aucune valeur réelle ici** (aucune donnée personnelle dans le dépôt) :
# c'est l'adresse du mainteneur, à poser dans le vrai `service.toml`, jamais
# dans celui-ci.
alerte_destinataire = ""

[admin]
# Sprint 12, QP6 (25/09/2026, tranchée (c)) : l'administration
# (`ourouler admin`) n'est jamais exposée sur Internet — elle n'écoute que
# sur 127.0.0.1, dans le conteneur, et se rejoint par un tunnel SSH puis
# `docker exec` (`deploiement/api/README.md`). Elle a son propre identifiant,
# **pas un compte cycliste** : un mot de passe de plus, distinct de celui de
# n'importe quel compte, comparé en temps constant à l'appel
# (`api/admin.py`).
#
# **Absente : l'administration ne démarre pas.** Ni en arrière-plan de
# l'entrypoint du conteneur, ni via `ourouler admin` lancé à la main (qui
# refuse alors avec un message qui nomme cette section) — rien à
# authentifier sans elle serait une porte sans serrure.
#
# `port` : le port d'écoute, sur 127.0.0.1 uniquement — jamais celui de
# l'API (8000), jamais déclaré dans `expose`/Traefik d'aucun fichier
# compose. Facultatif, défaut 8001 (`api.admin.PORT_ADMIN_DEFAUT`).
identifiant = ""
secret = ""
port = 8001
