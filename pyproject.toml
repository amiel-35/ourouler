[project]
name = "ourouler"
version = "0.0.1"
description = "Où rouler ? Météo par direction, tracé et séance pour cyclistes — CLI et bibliothèque."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Amiel Lavon" }]
dependencies = [
    "httpx>=0.27",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
]

[project.scripts]
ourouler = "ourouler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ourouler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
