[project]
name = "ourouler"
version = "0.0.1"
description = "Où rouler ? Météo par direction, tracé et séance pour cyclistes — CLI et bibliothèque."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Amiel Lavon" }]
dependencies = [
    "httpx>=0.27",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
    "numpy>=2.5.3",
]

[project.scripts]
ourouler = "ourouler.cli:main"

[project.optional-dependencies]
# L'API (lot F1) et son serveur. Extra séparé : `ourouler` reste une
# bibliothèque et une ligne de commande installables sans cadre web.
# `doctrine_architecture.md:74` autorisait Pydantic « tant qu'il n'y a pas
# d'API » — l'API arrive, FastAPI l'apporte.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Le dépôt d'un .ZWO/.MRC passe par un formulaire multipart : FastAPI
    # délègue son analyse à cette bibliothèque, qu'il ne tire pas tout seul.
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # L'extra `api` est repris ici pour que `uv run pytest` couvre
    # réellement les tests de l'API plutôt que de les sauter.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ourouler"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
