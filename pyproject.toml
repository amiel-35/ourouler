[project]
name = "ourouler"
version = "0.9.6"
description = "Où rouler ? Météo par direction, tracé et séance pour cyclistes — CLI et bibliothèque."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Amiel Lavon" }]
dependencies = [
    "httpx>=0.27",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
    "numpy>=2.5.3",
]

[project.scripts]
ourouler = "ourouler.cli:main"

[project.optional-dependencies]
# L'API (lot F1) et son serveur. Extra séparé : `ourouler` reste une
# bibliothèque et une ligne de commande installables sans cadre web.
# `doctrine_architecture.md:74` autorisait Pydantic « tant qu'il n'y a pas
# d'API » — l'API arrive, FastAPI l'apporte.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Le dépôt d'un .ZWO/.MRC passe par un formulaire multipart : FastAPI
    # délègue son analyse à cette bibliothèque, qu'il ne tire pas tout seul.
    "python-multipart>=0.0.9",
    # Les comptes (lot L7.2-A) vivent dans le PostgreSQL de l'hébergé
    # (doctrine §10.2). Pilote seul, SQL nu, pas d'ORM ; « binary » évite de
    # dépendre d'un libpq installé sur la machine.
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # L'extra `api` est repris ici pour que `uv run pytest` couvre
    # réellement les tests de l'API plutôt que de les sauter.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ourouler"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901", "PLR0912", "PLR0915", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 50
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"src/ourouler/api/application.py" = ["C901"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"src/ourouler/api/limite_corps.py" = ["C901"]
# exception datée : 2 fonction(s), à retirer au lot 12 (2026-12-31)
"src/ourouler/api/routes/meteo.py" = ["PLR0917"]
# exception datée : 5 fonction(s), à retirer au lot 12 (2026-12-31)
"src/ourouler/seance/placement.py" = ["C901", "PLR0917"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"src/ourouler/seance/tenue.py" = ["PLR0917"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/adversarial/test_adv_invariants.py" = ["C901"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/comptes/test_vie_privee_comptes.py" = ["PLR0915"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/test_sortie_carte.py" = ["PLR0917"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/validation/arrets_bloc_recup.py" = ["C901", "PLR0915"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/validation/cda_position_retrospectif.py" = ["C901", "PLR0915"]
# exception datée : 1 fonction(s), à retirer au lot 12 (2026-12-31)
"tests/validation/style_retrospectif.py" = ["C901", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
