[project]
name = "ourouler"
version = "0.10.0"
description = "Où rouler ? Météo par direction, tracé et séance pour cyclistes — CLI et bibliothèque."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Amiel Lavon" }]
keywords = ["vélo", "cyclisme", "météo", "capteur de puissance", "itinéraire", "entraînement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "httpx>=0.27",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
    "numpy>=2.5.3",
]

[project.urls]
Homepage = "https://github.com/amiel-35/ourouler"
Source = "https://github.com/amiel-35/ourouler"
Issues = "https://github.com/amiel-35/ourouler/issues"
Changelog = "https://github.com/amiel-35/ourouler/blob/main/CHANGELOG.md"

[project.scripts]
ourouler = "ourouler.cli:main"

[project.optional-dependencies]
# L'API et son serveur. Extra séparé : `ourouler` reste une bibliothèque et
# une ligne de commande installables sans cadre web. FastAPI apporte Pydantic,
# que `doctrine_architecture.md` (§3, « Stack ») réserve à l'API.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Le dépôt d'un .ZWO/.MRC passe par un formulaire multipart : FastAPI
    # délègue son analyse à cette bibliothèque, qu'il ne tire pas tout seul.
    "python-multipart>=0.0.9",
    # Les comptes vivent dans le PostgreSQL de l'hébergé
    # (doctrine §10.2). Pilote seul, SQL nu, pas d'ORM ; « binary » évite de
    # dépendre d'un libpq installé sur la machine.
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # L'extra `api` est repris ici pour que `uv run pytest` couvre
    # réellement les tests de l'API plutôt que de les sauter.
    "ourouler[api]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ourouler"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
# Le journal est une archive : ses blocs de code restent tels qu'écrits.
exclude = ["docs/journal/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901", "PLR0912", "PLR0915", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 50
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
# exception datée : 1 fonction(s), à retirer avant 2026-12-31
"src/ourouler/api/application.py" = ["C901"]
# exception datée : 1 fonction(s), à retirer avant 2026-12-31
"src/ourouler/api/limite_corps.py" = ["C901"]
# exception datée : 2 fonction(s), à retirer avant 2026-12-31
"src/ourouler/api/routes/meteo.py" = ["PLR0917"]
# exception permanente : scénario de bout en bout (semer, prouver, effacer, vérifier) lu dans l'ordre
"tests/comptes/test_vie_privee_comptes.py" = ["PLR0915"]
# exception permanente : script de mesure hors produit, sa fonction principale se lit d'une traite
"scripts/validation/arrets_bloc_recup.py" = ["C901", "PLR0915"]
# exception permanente : script de mesure hors produit, sa fonction principale se lit d'une traite
"scripts/validation/cda_position_retrospectif.py" = ["C901", "PLR0915"]
# exception permanente : script de mesure hors produit, sa fonction principale se lit d'une traite
"scripts/validation/style_retrospectif.py" = ["C901", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les modules d'outils des tests (`outils.py`, `fabriques*.py`, `outils_api.py`,
# `outils_caracterisation.py`, `donnees_synthetiques.py`) et les bouchons
# partagés d'un test à l'autre s'importent par leur nom, sans `sys.path.insert`.
# Leurs noms sont uniques dans tout `tests/` : c'est ce qui rend l'import sûr.
pythonpath = ["tests", "tests/adversarial", "tests/api", "tests/caracterisation"]
