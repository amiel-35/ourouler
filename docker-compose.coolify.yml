# Orchestration de l'hébergé minimal **sur Coolify**, distincte du
# docker-compose.yml local. Trois différences, et elles sont toutes des
# conséquences de l'hébergeur, pas des choix de confort :
#
# 1. **Aucun port publié.** Le reverse-proxy de Coolify (Traefik) termine le
#    TLS et parle au conteneur par le réseau interne. `http.server` ne doit
#    jamais voir un port ouvert sur Internet : il n'a ni limite de corps, ni
#    délai de lecture, ni protection contre un client lent.
# 2. **Le fichier TOML arrive par une variable**, `OUROULER_CONFIG_TOML_B64`,
#    et non par un montage : Coolify déploie depuis le dépôt git, il n'y a
#    pas de chemin hôte à monter. `entrypoint.py` l'écrit au démarrage.
# 3. **Le domaine vient de `SERVICE_FQDN_SERVEUR_8080`**, la variable magique
#    de Coolify : elle lui dit quel service exposer et sur quel port.
#
# Et une absence, qui se remarque en comparant avec le fichier local : pas un
# seul `${VAR:?message}`. Coolify ne connaît pas cette forme — il prend le
# message pour une valeur par défaut et démarre le conteneur avec, au lieu de
# refuser. Mesuré ici : `OUROULER_CONFIG_TOML_B64` valait littéralement « le
# TOML non-secrets, encodé en base64 ». Un garde qui ne garde pas et qui
# fabrique une valeur fausse est pire que pas de garde : `${VAR}` seul laisse
# la variable vide, et `config.charger` échoue franchement au démarrage.
#
# Et il vit à la racine, pas dans `deploiement/`, pour une raison mesurée :
# avec le fichier dans `deploiement/` et un `context: ..`, le déploiement
# échoue sur `lstat /artifacts/deploiement: no such file or directory`.
# Coolify ne résout pas le contexte de construction relativement au fichier
# compose comme le fait `docker compose`. À la racine, `context: .` désigne
# la racine du dépôt quelle que soit la façon dont l'outil s'y prend.
#
# Tout le reste — les deux rôles, le volume partagé, le fait que le départ,
# la clé Intervals et BRouter ne vivent qu'en variables — est identique au
# local, et c'est voulu : ce qui tourne en ligne doit être ce qu'on a vérifié
# sur sa machine.

services:
  generateur:
    build:
      context: .
      dockerfile: deploiement/Dockerfile
    command: ["python3", "deploiement/generateur/entrypoint.py"]
    environment:
      OUROULER_CONFIG: /config/config.toml
      OUROULER_CONFIG_TOML_B64: ${OUROULER_CONFIG_TOML_B64}
      OUROULER_DOSSIER_PAGES: /data/pages
      OUROULER_HEURE_GENERATION: ${OUROULER_HEURE_GENERATION:-06:00}
      OUROULER_INTERVALS_API_KEY: ${OUROULER_INTERVALS_API_KEY}
      OUROULER_INTERVALS_ATHLETE_ID: ${OUROULER_INTERVALS_ATHLETE_ID}
      OUROULER_DEPART_NOM: ${OUROULER_DEPART_NOM}
      OUROULER_DEPART_LATITUDE: ${OUROULER_DEPART_LATITUDE}
      OUROULER_DEPART_LONGITUDE: ${OUROULER_DEPART_LONGITUDE}
      OUROULER_BROUTER_URL: ${OUROULER_BROUTER_URL}
      OUROULER_BROUTER_UTILISATEUR: ${OUROULER_BROUTER_UTILISATEUR:-}
      OUROULER_BROUTER_MOT_DE_PASSE: ${OUROULER_BROUTER_MOT_DE_PASSE:-}
    volumes:
      - pages:/data/pages
    restart: unless-stopped

  serveur:
    build:
      context: .
      dockerfile: deploiement/Dockerfile
    command: ["python3", "deploiement/serveur/serveur.py"]
    environment:
      - SERVICE_FQDN_SERVEUR_8080
      - OUROULER_DOSSIER_PAGES=/data/pages
      - OUROULER_PORT=8080
      - OUROULER_WWW_UTILISATEUR=${OUROULER_WWW_UTILISATEUR}
      - OUROULER_WWW_MOT_DE_PASSE=${OUROULER_WWW_MOT_DE_PASSE}
    volumes:
      - pages:/data/pages:ro
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  pages:
