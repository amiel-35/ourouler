name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # historique complet nécessaire pour que gitleaks scanne tous les commits
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Le binaire, version épinglée, plutôt que gitleaks-action : l'action
      # interroge l'API des PR (permission refusée ici) et, sur une PR, ne lit
      # que les commits de la PR. Ici, tout l'historique est parcouru ; les
      # faux positifs connus sont écartés par .gitleaksignore.
      # Somme de contrôle publiée par la release (gitleaks_8.24.3_checksums.txt).
      - name: Chercher des secrets dans tout l'historique
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks git . --redact --no-banner --verbose

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12

      # dev est un extra d'optional-dependencies, pas un groupe
      - run: uv sync --frozen --extra dev --python 3.12

      - run: uv run ruff check .

      # les tests de comptes lancent ce conteneur eux-mêmes et sont sautés si l'image manque
      - run: docker pull postgres:17-alpine

      # CI=true (posé par GitHub Actions) : tests/conftest.py fait échouer la
      # session sur tout saut absent de tests/sauts_autorises.py — un test
      # Postgres sauté compris (« PostgreSQL local indisponible » n'y est pas).
      - name: Tests
        run: uv run pytest -q -rs

  front:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run verifier

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -f deploiement/api/Dockerfile -t ourouler-api:ci .

      - name: Démarrer l’image sans Postgres, en mode hébergé
        run: |
          printf '[cache]\ndossier = "/data/cache"\n' > heberge.toml
          docker run -d --name api -p 8000:8000 \
            -e OUROULER_MODE=heberge \
            -e OUROULER_CONFIG=/config/config.toml \
            -e OUROULER_CONFIG_TOML_B64="$(base64 -w0 heberge.toml)" \
            ourouler-api:ci

      - name: Attendre que /sante réponde 200
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sante || true)
            if [ "$code" = "200" ]; then
              echo "OK après ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout : /sante n'a jamais rendu 200"
          exit 1

      - name: Vérifier les routes
        run: |
          code_sante=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sante)
          code_racine=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)
          code_profil=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/profil)
          echo "sante=$code_sante racine=$code_racine profil=$code_profil"
          [ "$code_sante" = "200" ] && [ "$code_racine" = "200" ] && [ "$code_profil" = "401" ]

      - name: Journal de l’API en cas d’échec
        if: failure()
        run: docker logs api
