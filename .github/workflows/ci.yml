name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Annuler un run dépassé seulement sur une PR : jamais sur un push à main/prod.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      # historique complet nécessaire pour que gitleaks scanne tous les commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le binaire, version épinglée, plutôt que gitleaks-action : l'action
      # interroge l'API des PR (permission refusée ici) et, sur une PR, ne lit
      # que les commits de la PR. Ici, tout l'historique est parcouru ; les
      # faux positifs connus sont écartés par .gitleaksignore.
      - name: Chercher des secrets dans tout l'historique
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --verbose

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      # dev est un extra d'optional-dependencies, pas un groupe
      - run: uv sync --frozen --extra dev --python 3.12

      - run: uv run ruff check .

      # Base de comparaison : la branche cible sur une PR ; sur un push (main
      # comme prod), le commit d'avant le push, sauf branche toute neuve (before
      # nul) où l'on compare à origin/main. Une base introuvable fait échouer.
      # --commits : chaque commit de base..HEAD qui touche sprints.toml est
      # vérifié contre son premier parent (un diff = un commit).
      - name: Vérifier le backlog
        env:
          EVENEMENT: ${{ github.event_name }}
          BRANCHE_CIBLE: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
        run: |
          REF_NULLE=0000000000000000000000000000000000000000
          if [ "$EVENEMENT" = "pull_request" ]; then
            base="origin/$BRANCHE_CIBLE"
          elif [ "$EVENEMENT" = "push" ]; then
            if [ "$AVANT" = "$REF_NULLE" ] || [ -z "$AVANT" ]; then
              base="origin/main"
            else
              base="$AVANT"
            fi
          else
            base="origin/main"
          fi
          echo "Base de comparaison du backlog : $base"
          uv run python scripts/verifier_backlog.py --commits "$base"

      # les tests de comptes lancent ce conteneur eux-mêmes et sont sautés si l'image manque
      - run: docker pull postgres:17-alpine

      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -q -rs 2>&1 | tee pytest.log

      # un test Postgres sauté = CI rouge
      - name: Vérifier qu’aucun test Postgres n’a été sauté
        run: |
          if grep -q "PostgreSQL local indisponible" pytest.log; then
            echo "Test(s) Postgres sauté(s) : CI rouge."
            exit 1
          fi

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run verifier

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f deploiement/api/Dockerfile -t ourouler-api:ci .

      - name: Démarrer l’image sans Postgres, en mode hébergé
        run: |
          printf '[cache]\ndossier = "/data/cache"\n' > heberge.toml
          docker run -d --name api -p 8000:8000 \
            -e OUROULER_MODE=heberge \
            -e OUROULER_CONFIG=/config/config.toml \
            -e OUROULER_CONFIG_TOML_B64="$(base64 -w0 heberge.toml)" \
            ourouler-api:ci

      - name: Attendre que /sante réponde 200
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sante || true)
            if [ "$code" = "200" ]; then
              echo "OK après ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout : /sante n'a jamais rendu 200"
          exit 1

      - name: Vérifier les routes
        run: |
          code_sante=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sante)
          code_racine=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)
          code_profil=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/profil)
          echo "sante=$code_sante racine=$code_racine profil=$code_profil"
          [ "$code_sante" = "200" ] && [ "$code_racine" = "200" ] && [ "$code_profil" = "401" ]

      - name: Journal de l’API en cas d’échec
        if: failure()
        run: docker logs api
