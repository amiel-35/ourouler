# Orchestration de l'API+front (lot L7.E) **sur Coolify**, distincte du
# `deploiement/api/docker-compose.yml` local. Même différences que celles déjà
# mesurées pour le générateur de la page du jour (`docker-compose.coolify.yml`,
# à lire d'abord) et toutes conséquences de l'hébergeur, pas des choix de
# confort :
#
# 1. **Aucun port publié.** Le reverse-proxy de Coolify (Traefik) termine le
#    TLS et parle au conteneur par le réseau interne.
# 2. **Le fichier TOML arrive par une variable**, `OUROULER_CONFIG_TOML_B64`,
#    et non par un montage : Coolify déploie depuis le dépôt git, il n'y a
#    pas de chemin hôte à monter. `deploiement/api/entrypoint.py` l'écrit au
#    démarrage — le même geste que `deploiement/generateur/entrypoint.py`.
# 3. **Le domaine vient de `SERVICE_FQDN_API_8000`**, la variable magique de
#    Coolify : elle lui dit quel service exposer et sur quel port. Le front
#    et l'API partagent cette même origine (un seul conteneur, voir
#    `deploiement/api/README.md` pour pourquoi) : il n'y a qu'une seule
#    variable `SERVICE_FQDN_*` à poser pour les deux.
#
# Et une absence, mesurée sur le même piège que le générateur : pas un seul
# `${VAR:?message}`. Coolify prend le message pour une valeur par défaut et
# démarre le conteneur avec, au lieu de refuser — `${VAR}` seul laisse la
# variable vide, et `config.charger` (ou, pour `OUROULER_MODE`, l'API
# elle-même) échoue franchement, ou refuse franchement, au démarrage.
#
# Et il vit à la racine, pas dans `deploiement/`, pour la même raison mesurée
# que `docker-compose.coolify.yml` : avec le fichier dans `deploiement/` et un
# `context: ..`, le déploiement échoue sur `lstat /artifacts/deploiement: no
# such file or directory`. Coolify ne résout pas le contexte de construction
# relativement au fichier compose comme le fait `docker compose`. À la
# racine, `context: .` désigne la racine du dépôt quelle que soit la façon
# dont l'outil s'y prend.
#
# **`OUROULER_MODE` n'a pas de défaut ici, et c'est voulu.** Le poser à
# `personnel` (le mainteneur, seul cycliste, sur son propre déploiement) ou
# `heberge` (plusieurs cyclistes — aucune méthode de connexion n'est branchée
# tant que le mainteneur n'en a pas décidé une, hors périmètre du sprint 7)
# est un choix produit, pas une valeur qui se devine : l'absence de variable
# vaut déjà `heberge` côté code (`api/exploitation.fournisseur_session`), donc
# ce fichier n'a pas besoin de la répéter pour obtenir ce comportement, et ne
# doit surtout pas y substituer `personnel` en silence.

services:
  api:
    build:
      context: .
      dockerfile: deploiement/api/Dockerfile
    # Tout en dictionnaire : mélanger la forme liste (`- CLE`) et la forme
    # dictionnaire (`CLE: valeur`) dans le même bloc est un YAML invalide, et
    # le déploiement échoue sur « did not find expected '-' indicator » sans
    # dire lequel des deux blocs est fautif (constaté le 18/09/2026, avant le
    # premier déploiement). `SERVICE_FQDN_API_8000` sans valeur est repris de
    # l'environnement, ce que la forme dictionnaire écrit avec une valeur vide.
    environment:
      SERVICE_FQDN_API_8000: ${SERVICE_FQDN_API_8000:-}
      OUROULER_MODE: ${OUROULER_MODE}
      OUROULER_CONFIG: /config/config.toml
      OUROULER_CONFIG_TOML_B64: ${OUROULER_CONFIG_TOML_B64}
      OUROULER_PORT: "8000"
      OUROULER_INTERVALS_API_KEY: ${OUROULER_INTERVALS_API_KEY}
      OUROULER_INTERVALS_ATHLETE_ID: ${OUROULER_INTERVALS_ATHLETE_ID}
      OUROULER_DEPART_NOM: ${OUROULER_DEPART_NOM}
      OUROULER_DEPART_LATITUDE: ${OUROULER_DEPART_LATITUDE}
      OUROULER_DEPART_LONGITUDE: ${OUROULER_DEPART_LONGITUDE}
      OUROULER_BROUTER_URL: ${OUROULER_BROUTER_URL}
      OUROULER_BROUTER_UTILISATEUR: ${OUROULER_BROUTER_UTILISATEUR:-}
      OUROULER_BROUTER_MOT_DE_PASSE: ${OUROULER_BROUTER_MOT_DE_PASSE:-}
    volumes:
      - donnees:/data/cache
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  donnees:
