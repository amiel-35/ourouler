# Configuration ourouler — à copier dans ~/.config/ourouler/config.toml
# (ou passer --config <fichier>). Ce fichier d'exemple ne contient aucune donnée
# réelle : toutes les valeurs sont inventées. Le vrai fichier est ignoré par git.

[depart]
nom = "Maison"
latitude = 47.0000    # inventé : mettre son vrai point de départ
longitude = -0.5000   # (47.0, -1.0) tombait à 48 km de Nantes, sous le seuil de l'invariant

[cycliste]
masse_kg = 75.0
ftp_w = 250

[[velos]]
nom = "Route"
usage = "route"        # route | clm
masse_kg = 9.0         # vélo équipé (bidons, GPS…)
cda_m2 = 0.32          # point de départ, recalibré sur l'historique
# crr = 0.005          # roulement, estimé par `ourouler calibrer`
intervals_gear = ""    # nom du vélo dans Intervals.icu (Settings → Gear)
intervals_gear_id = "" # identifiant Intervals du vélo (ex. b1234567), plus fiable que le nom
capteur_puissance = "" # valeur exacte du champ Intervals « power_meter », ex. "MARQUE 1234"
# facteur_compteur = 0.85  # exemple — moyenne réelle d'une sortie (distance / temps écoulé, arrêts
                           # compris) rapportée à la vitesse à plat, sans vent, lancé.
                           # Se mesure sur son propre historique :
                           #   uv run python tests/validation/facteur_compteur_retrospectif.py
                           # Absent, il est dérivé du modèle et de la masse — une
                           # supposition, pas une mesure.
# periodes = [{ debut = 2024-01-01 }, { debut = 2025-03-01, fin = 2025-06-30 }]

[meteo]
directions = 8                 # 8 ou 16
distances_km = [15, 25, 40]
modele = "meteofrance_arome_france_hd"
second_avis = "icon_seamless"  # désaccord entre modèles = indice de confiance
horizon_h = 6

[intervals]
athlete_id = ""   # ex. i123456 (Intervals.icu → Settings)
api_key = ""      # Intervals.icu → Settings → Developer. Jamais dans le dépôt.

[cache]
dossier = "~/.cache/ourouler"

[brouter]
# Serveur BRouter (auto-hébergé, voir doctrine §6). Vide = sous-commande boucle indisponible.
url = ""
utilisateur = ""
mot_de_passe = ""
# Profils relevés sur le serveur : fastbike, fastbike-verylowtraffic, trekking,
# gravel… ATTENTION : « fastbike-lowtraffic » n'existe pas, et un profil absent
# se manifeste par un HTTP 500 sans corps.
profil = "fastbike"

[boucle]
vitesse_moyenne_kmh = 27   # en attendant le modèle physique
sens = "horaire"           # horaire en France, antihoraire au Royaume-Uni
candidates = 5
tolerance_distance = 0.10

historique_depuis = 2023-12-01   # fenêtre d'historique pour la calibration

[calibration]
mots_groupe = ["club", "groupe", "peloton", "sortie club"]  # sorties écartées de la calibration
part_validation = 0.25                        # part des sorties gardées pour tester le modèle
vitesse_min_kmh = 8

# [[evitements]]                               # zones à éviter, transmises au moteur de tracé
# nom = "carrefour dangereux"
# latitude = 47.0
# longitude = -0.5
# rayon_m = 200

[seance]
# Seules les zones 2 d'ouverture et de fermeture sont élastiques : les récupérations
# font partie de la prescription et ne bougent jamais.
elasticite_z2_max = 0.20     # allongement maximal de l'échauffement, pour atteindre un bon couloir
elasticite_z2_min = -0.05
# Le retour au calme, lui, ne place rien : il referme une boucle dont la longueur n'est
# jamais exacte. Sa fenêtre est donc largement ouverte vers le haut (Q14, 13/09/2026 —
# « le retour au calme en fait peut dépasser de plus, c'est souvent ce que je fais car
# c'est incontrôlable de faire parfait, et c'est du kilomètre facile. Faut réduire le
# dépassement au max. »). Dépasser n'est pas une faute : chaque minute en trop se paie,
# mais peu et sans seuil, ce qui suffit à préférer la boucle la plus juste à terrain égal.
# Au-delà de cette borne haute, ce n'est plus la boucle qui tombe mal, c'est la boucle qui
# ne va pas avec la séance : on le dit. Bornes : 0 à 5 (soit jusqu'à +500 %).
elasticite_calme_max = 1.5   # +150 % : le retour au calme absorbe, il n'est pas un levier
# Le raccourcir, en revanche, ampute la séance et reste très cher. Bornes : −0,5 à 0.
elasticite_calme_min = -0.05
demi_tour_penalite = 1.0     # coût d'un bloc qui reprend le segment précédent en sens inverse
# Les zones de puissance, en fraction de la FTP, de Z1 à la dernière. Défaut : la table
# de Coggan, celle que le compte Intervals.icu du mainteneur renvoie au pourcent près.
# Trois zones au minimum, croissantes, sans chevauchement (les trous sont permis).
# zones = [[0.0, 0.55], [0.56, 0.75], [0.76, 0.90], [0.91, 1.05], [1.06, 1.20], [1.21, 1.50], [1.51, 2.00]]

# OÙ VOUS VOUS PLACEZ DANS VOTRE BANDE : 0 = bas de la zone, 1 = haut, 0,5 = milieu.
# C'est la seule chose qu'on stocke (décision 7 du cycle UX) : la FTP progresse ou les
# zones décalent, tout l'escalier suit sans qu'on touche à ce fichier. La même position
# vaut pour toutes les zones fermées — au milieu de sa Z2, on est au milieu de sa Z3.
# La puissance d'endurance n'est donc PLUS un réglage : elle se déduit de cette position
# dans la Z2, et `ourouler config` l'affiche en watts pour que vous la vérifiiez.
# Défaut 0,2105 = la position qu'occupe 0,60 de FTP — la médiane mesurée sur les sorties
# extérieures du mainteneur (Q11) — dans la Z2 par défaut. Bornes : −1 à 2 ; hors de
# [0, 1] veut dire « hors de la bande », ce qui se voit plutôt que de se corriger tout seul.
position_zone = 0.2105263157894737
# Compatibilité : une configuration qui porte encore `puissance_endurance_pct` (une valeur,
# bornes 0,40 à 0,80) est lue et convertie en position, à l'identique. Si les deux clés sont
# là, `position_zone` l'emporte. Ne gardez que l'une des deux.
# La conversion passe par les mêmes bornes (−1 à 2) que `position_zone` : ce qui se charge
# doit pouvoir se recharger. Elle est donc refusée, en nommant votre Z2, si l'ancienne valeur
# tombe loin de la bande d'une table `zones` personnalisée — les deux réglages disent alors
# deux choses différentes, et rien ne peut les réconcilier sans en jeter une en silence.
# Écrivez `position_zone` et retirez l'ancienne clé.
# puissance_endurance_pct = 0.60
# Sous cette part de FTP, une étape n'est pas un bloc mais de l'échauffement, de la
# récupération ou du retour au calme. Dernier recours du typage, quand la séance ne porte
# ni marqueur ni texte explicite. Bornes : 0,50 à 0,90.
seuil_recuperation_pct = 0.75
# Depuis le sprint 5, le vent entre dans la note qui classe les boucles — avant lui,
# seul le relief (carrefours, bâti, pente) comptait. En dessous de cet écart relatif de
# note, deux boucles sont considérées équivalentes et c'est la plus sèche qui gagne,
# comme avant le sprint 5 ; au-delà, c'est la boucle la mieux orientée par rapport au
# vent qui gagne, même si elle prend un peu plus la pluie. Mettre à 0 pour que le vent
# tranche toujours. 0,15 (15 %) est la valeur mesurée par défaut sur les boucles réelles
# du mainteneur (docs/sprint5_contrat.md §1.6) ; bornes : 0 à 0,5.
tolerance_egalite = 0.15

[tenue]
bornes_c = [3, 9, 15, 22, 30]      # très froid / froid / frais / modéré / chaud / canicule, en ressenti
bornes_pluie_mmh = [0.2, 0.5, 1.0] # sec / humide / averses / pluie
vent_veste_kmh = 30

# Tenue par catégorie. Une catégorie absente garde le défaut du code.
# [tenue.tenues]
# "très froid" = ["collant", "veste hiver", "sous-couche", "gants longs", "couvre-chaussures", "bonnet"]
# froid = ["collant", "veste", "gants longs", "couvre-chaussures", "tour de cou"]
# frais = ["cuissard", "maillot long", "gilet", "jambières"]
# "modéré" = ["cuissard", "maillot", "manchettes dans la poche"]
# chaud = ["cuissard", "maillot"]
# canicule = ["cuissard", "maillot ajouré", "crème solaire", "deux bidons"]
