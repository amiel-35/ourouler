# Fichier TOML du conteneur « générateur » de l'hébergé minimal
# (docs/heberge_minimal_contrat.md). Toutes les valeurs sont inventées.
#
# Différence avec config.example.toml (usage local, racine du dépôt) :
# **ce fichier ne porte jamais [depart] ni [intervals], et [brouter] n'y a
# que `profil`** — ces trois-là viennent des variables d'environnement
# `OUROULER_DEPART_*`, `OUROULER_INTERVALS_*`, `OUROULER_BROUTER_*`, posées
# dans `deploiement/.env` (jamais commitées). C'est la vraie décision du
# lot : la clé Intervals et le point de départ ne doivent exister nulle part
# ailleurs qu'en variable d'environnement.
#
# Copier hors du dépôt (ou sous un nom que .gitignore couvre déjà, comme
# `deploiement/config.local.toml`), renseigner, et faire pointer
# `OUROULER_CONFIG_HOTE` (dans deploiement/.env) vers ce fichier.

[cycliste]
masse_kg = 75.0
ftp_w = 250

[[velos]]
nom = "Route"
usage = "route"        # route | clm
masse_kg = 9.0
intervals_gear = ""    # nom du vélo dans Intervals.icu (Settings → Gear)
intervals_gear_id = "" # identifiant Intervals du vélo, plus fiable que le nom
capteur_puissance = "" # valeur exacte du champ Intervals « power_meter »

[meteo]
directions = 8
distances_km = [15, 25, 40]
modele = "meteofrance_arome_france_hd"
second_avis = "icon_seamless"
horizon_h = 6

[cache]
dossier = "/data/cache"  # chemin **dans le conteneur**, pas sur l'hôte

[brouter]
# url, utilisateur, mot_de_passe : volontairement absents, voir plus haut.
profil = "fastbike"

[boucle]
vitesse_moyenne_kmh = 27
sens = "horaire"
candidates = 5
tolerance_distance = 0.10

# [seance], [tenue], [calibration] : omis ici, les défauts du code
# s'appliquent (voir config.example.toml pour les valeurs et leur sens).
