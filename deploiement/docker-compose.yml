# Orchestration LOCALE des deux conteneurs du contrat de l'hébergé minimal
# (docs/journal/sprints/heberge_minimal_contrat.md). Sert à vérifier le lot chez le
# mainteneur, sur sa machine — ce n'est PAS un artefact de déploiement sur son
# Coolify (règle absolue 7 de CLAUDE.md : aucune installation sur un serveur
# sans son accord explicite, soumis séparément).
#
# Lancer depuis la racine du dépôt :
#   docker compose -f deploiement/docker-compose.yml --env-file deploiement/.env up --build
#
# Toutes les valeurs sensibles viennent de `deploiement/.env` (copié depuis
# `.env.example`, jamais commité — voir .gitignore) : ce fichier ne contient
# aucune valeur, seulement des références `${...}`.

services:
  generateur:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    command: ["python3", "deploiement/generateur/entrypoint.py"]
    environment:
      OUROULER_CONFIG: /config/config.toml
      OUROULER_DOSSIER_PAGES: /data/pages
      OUROULER_HEURE_GENERATION: ${OUROULER_HEURE_GENERATION:-06:00}
      OUROULER_INTERVALS_API_KEY: ${OUROULER_INTERVALS_API_KEY:?définir dans deploiement/.env}
      OUROULER_INTERVALS_ATHLETE_ID: ${OUROULER_INTERVALS_ATHLETE_ID:?définir dans deploiement/.env}
      OUROULER_DEPART_NOM: ${OUROULER_DEPART_NOM:?définir dans deploiement/.env}
      OUROULER_DEPART_LATITUDE: ${OUROULER_DEPART_LATITUDE:?définir dans deploiement/.env}
      OUROULER_DEPART_LONGITUDE: ${OUROULER_DEPART_LONGITUDE:?définir dans deploiement/.env}
      OUROULER_BROUTER_URL: ${OUROULER_BROUTER_URL:?définir dans deploiement/.env}
      OUROULER_BROUTER_UTILISATEUR: ${OUROULER_BROUTER_UTILISATEUR:-}
      OUROULER_BROUTER_MOT_DE_PASSE: ${OUROULER_BROUTER_MOT_DE_PASSE:-}
    volumes:
      - pages:/data/pages
      # Fichier TOML non-secrets (cycliste, vélos, météo, séance, tenue...) :
      # depart/intervals/brouter sont volontairement absents de ce fichier et
      # viennent des variables ci-dessus — voir deploiement/README.md.
      - ${OUROULER_CONFIG_HOTE:?définir dans deploiement/.env}:/config/config.toml:ro
    restart: unless-stopped

  serveur:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    command: ["python3", "deploiement/serveur/serveur.py"]
    environment:
      OUROULER_DOSSIER_PAGES: /data/pages
      OUROULER_PORT: "8080"
      OUROULER_WWW_UTILISATEUR: ${OUROULER_WWW_UTILISATEUR:?définir dans deploiement/.env}
      OUROULER_WWW_MOT_DE_PASSE: ${OUROULER_WWW_MOT_DE_PASSE:?définir dans deploiement/.env}
    volumes:
      - pages:/data/pages:ro
    ports:
      - "${OUROULER_PORT_HOTE:-8080}:8080"
    restart: unless-stopped

volumes:
  pages:
