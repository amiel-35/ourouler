# Fichier TOML du conteneur API+front, mode `OUROULER_MODE=heberge`
# (plusieurs cyclistes, chacun avec son compte). Toutes les valeurs sont
# inventées.
#
# Différence avec config.example.toml (usage local, racine du dépôt), et même
# raison que deploiement/config.example.toml pour le générateur de la page du
# jour : **ce fichier ne porte jamais [depart] ni [intervals], et [brouter]
# n'y a que `profil`** — ces trois-là viennent des variables d'environnement
# `OUROULER_DEPART_*`, `OUROULER_INTERVALS_*`, `OUROULER_BROUTER_*`
# (`config.py:_survoler_environnement`, déjà lu par l'API comme par la ligne
# de commande). La clé Intervals et le point de départ ne doivent exister
# nulle part ailleurs qu'en variable d'environnement.
#
# Ce fichier, lui, n'est pas secret : c'est celui qu'on encode en base64 dans
# `OUROULER_CONFIG_TOML_B64` (voir deploiement/api/README.md).
#
# **Ni [cycliste] ni [[velos]] ici** : ce sont des réglages personnels,
# jamais hérités d'un socle partagé, au même titre que [depart] et
# [intervals] — l'API **refuse de démarrer** si l'une de ces quatre sections
# figure dans le TOML hébergé, ou si l'une des variables
# `OUROULER_DEPART_*`/`OUROULER_INTERVALS_*` est posée (elles seraient sinon
# distribuées à chaque personne invitée). Chaque cycliste renseigne son
# profil depuis l'assistant, une fois son compte activé. Pour un déploiement
# à un seul cycliste, utiliser `config.personnel.example.toml` à la place,
# qui porte ces deux sections.

[meteo]
directions = 8
distances_km = [15, 25, 40]
modele = "meteofrance_arome_france_hd"
second_avis = "icon_seamless"
horizon_h = 6

[cache]
dossier = "/data/cache"  # chemin **dans le conteneur**, sous le volume partagé

[brouter]
# url, utilisateur, mot_de_passe : volontairement absents, voir plus haut.
profil = "fastbike"

[boucle]
vitesse_moyenne_kmh = 27
sens = "horaire"
candidates = 5
tolerance_distance = 0.10

# [seance], [tenue], [calibration] : omis ici, les défauts du code
# s'appliquent (voir config.example.toml pour les valeurs et leur sens).
